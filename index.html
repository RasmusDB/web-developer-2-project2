<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIV Item Search</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<main>

    <h1>XIV Item Search</h1>

    <form id="search-form">
        <input id="search-input" type="text" placeholder="Enter item name..." required>
        <button type="submit">Search</button>
    </form>

    <p id="status"></p>
    <div id="results"></div>
    <div id="details"></div>
    <button id="load-more" type="button" hidden>Load more</button>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>

</main>

</body>

</html>
